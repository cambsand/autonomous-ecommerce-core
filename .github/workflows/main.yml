name: Autonomous Core CI/CD & Automated Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  # Esecuzione programmata automatica ogni giorno alle 08:00 UTC
  schedule:
    - cron: "0 8 * * *"
  # Permette anche l'avvio manuale con un click dal pulsante "Run workflow" su GitHub
  workflow_dispatch:

jobs:
  test-and-verify:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Create mock env file and directories
      run: |
        mkdir -p data exports
        touch .env

    - name: Run Pipeline Smoke Test
      run: |
        python main.py

    - name: Verify Database Status
      run: |
        python -c "import sqlite3; conn = sqlite3.connect('data/ecommerce_core.db'); print('DB Status OK')"