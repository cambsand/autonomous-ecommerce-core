name: Autonomous Core CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-verify:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Pipeline Smoke Test
      run: |
        python main.py

    - name: Verify Database and Export Files
      run: |
        python -c "import sqlite3; conn = sqlite3.connect('data/ecommerce_core.db'); print('DB Status OK')"